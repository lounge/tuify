linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
    # Additions past the minimal core set — each chosen for signal over noise:
    # - gosec: common security footguns (weak crypto, insecure perms, etc).
    # - misspell: catches typos in comments/strings. Zero false positives.
    # - gocritic: opt-in bug-oriented style lints. Default checks are
    #   conservative and mostly catch real mistakes, not stylistic taste.
    - gosec
    - misspell
    - gocritic

linters-settings:
  errcheck:
    # Stdlib calls whose errors are almost always OK to ignore in this
    # codebase (file close on read-only handle, discarded reader input, etc).
    # Revisit if any of these start masking real bugs.
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - (*bufio.Reader).ReadString
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln

  gosec:
    # G115 (integer overflow conversion) fires on audio/graphics code
    # everywhere PCM samples, volume levels, or image pixels are cast
    # between fixed-width types. Those conversions are bounded by the
    # domain (int16 PCM, 0–100 volume, uint8 RGB) and explicit clamping
    # happens at the boundary, so the warnings are pure noise here.
    excludes:
      - G115
      # G204 flags exec.Command with a non-literal path. Here the path
      # comes from the user's own config.json (librespot_path) — not
      # untrusted network input — so the warning is a false positive for
      # a TUI that deliberately invokes a user-selected binary.
      - G204

  gocritic:
    disabled-checks:
      # singleCaseSwitch fires on `switch msg := msg.(type)` even when
      # there's genuinely one case today — the type-switch form is
      # idiomatic and forward-looking (easy to add cases). Rewriting to
      # an if-ok assertion costs clarity for no real gain.
      - singleCaseSwitch

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Tests routinely ignore write/encode errors on httptest responses
    # and throwaway setup calls. Real bugs there surface as test
    # failures, not silent error swallowing.
    - path: _test\.go
      linters:
        - errcheck
